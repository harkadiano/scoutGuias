<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Tablero de Lotería</title>

    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/loteria.css" rel="stylesheet">
  </head>
  <body>
    <main class="pantalla">
      <section id="tablero" class="tablero" role="grid" aria-label="Tablero de lotería"></section>

      <aside class="acciones">
        <button type="button" class="btn btn-danger btn-reiniciar" id="btnReiniciar" aria-label="Reiniciar tablero" title="Reiniciar tablero">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" focusable="false">
            <path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2z"/>
            <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466"/>
          </svg>
        </button>
      </aside>
    </main>

    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="js/loteria.js"></script>
  </body>
</html>
